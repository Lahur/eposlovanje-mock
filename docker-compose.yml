services:
  app:
    build: .
    ports:
      - "8082:8082"
    environment:
      EPOSLOVANJE_BASE_URL: ${EPOSLOVANJE_BASE_URL}
      EPOSLOVANJE_API_KEY: ${EPOSLOVANJE_API_KEY}
      PONDI_BASE_URL: ${PONDI_BASE_URL}
      PONDI_API_KEY: ${PONDI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
